<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000">
<rect width="720" height="1000" fill="#FFFFFF"/>
<title>Camadas do tecido de inserção supracrestal</title>
<desc>Corte esquemático do colo de um dente, coroa para cima, mostrando só um lado. De cima para baixo, junto ao dente: sulco gengival, epitélio juncional, inserção conjuntiva supracrestal e, logo abaixo, a crista óssea. A gengiva fica por fora e o osso abaixo. As duas camadas coloridas formam o tecido de inserção supracrestal. Sem medidas: a altura varia e só se mede por histologia.</desc>
<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<path d="M270,250 Q295,235 305,215 L430,185 L430,610 L270,610 Z" fill="#F2A7A0"/>
<path d="M270,610 L270,250 Q295,235 305,215 L430,185" fill="none" stroke="#1F4D4F" stroke-width="4" stroke-linejoin="round"/>
<rect x="230" y="610" width="200" height="130" fill="#E2CDB2"/>
<line x1="230" y1="610" x2="430" y2="610" stroke="#C9AE8A" stroke-width="8"/>
<rect x="230" y="330" width="40" height="140" fill="#E6EEEC" stroke="#1F4D4F" stroke-width="3"/>
<rect x="230" y="470" width="40" height="140" fill="#B86A3C" fill-opacity="0.55" stroke="#1F4D4F" stroke-width="3"/>
<g stroke="#8A4A25" stroke-width="3"><line x1="232" y1="598" x2="268" y2="530"/><line x1="232" y1="560" x2="268" y2="496"/><line x1="232" y1="524" x2="268" y2="484"/></g>
<path d="M40,110 Q40,50 100,50 H190 Q230,50 230,110 V740 H40 Z" fill="#FBF6EA"/>
<path d="M40,110 Q40,50 100,50 H190 Q230,50 230,110 V740" fill="none" stroke="#1F4D4F" stroke-width="4" stroke-linejoin="round"/>
<text x="135" y="400" font-size="28" font-weight="700" fill="#1F4D4F" text-anchor="middle">Dente</text>
<text x="352" y="350" font-size="28" font-weight="700" fill="#1F4D4F" text-anchor="middle">Gengiva</text>
<text x="330" y="700" font-size="28" font-weight="700" fill="#1F4D4F" text-anchor="middle">Osso</text>
<g stroke="#1F4D4F" stroke-width="3" fill="#1F4D4F">
<line x1="250" y1="290" x2="455" y2="290"/><circle cx="250" cy="290" r="6" stroke="none"/>
<line x1="250" y1="400" x2="455" y2="400"/><circle cx="250" cy="400" r="6" stroke="none"/>
<line x1="250" y1="540" x2="455" y2="540"/><circle cx="250" cy="540" r="6" stroke="none"/>
<line x1="360" y1="640" x2="455" y2="640"/><circle cx="360" cy="640" r="6" stroke="none"/>
</g>
<g font-size="28" font-weight="700" fill="#1F4D4F">
<text x="468" y="299">Sulco</text>
<text x="468" y="337">gengival</text>
<text x="468" y="390">Epitélio</text>
<text x="468" y="426">juncional</text>
<text x="468" y="500">Inserção</text>
<text x="468" y="536">conjuntiva</text>
<text x="468" y="572">supracrestal</text>
<text x="468" y="630">Crista</text>
<text x="468" y="666">óssea</text>
</g>
<rect x="20" y="775" width="680" height="205" rx="18" fill="#E6EEEC" stroke="#1F4D4F" stroke-width="4"/>
<g text-anchor="middle">
<text x="360" y="823" font-size="30" font-weight="700" fill="#B86A3C">Tecido de inserção supracrestal</text>
<text x="360" y="866" font-size="28" fill="#1F4D4F">epitélio juncional + tecido conjuntivo</text>
<text x="360" y="900" font-size="28" fill="#1F4D4F">supracrestal de inserção</text>
<text x="360" y="948" font-size="26" fill="#4A5B5C">a altura varia; só a histologia mede</text>
</g>
</g>
</svg>
