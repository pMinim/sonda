<rect x="352" y="145" width="96" height="10" rx="5" fill="#B86A3C"/>
<circle cx="352" cy="150" r="15" fill="#B86A3C"/>
<circle cx="448" cy="150" r="15" fill="#B86A3C"/>
<text x="400" y="268" font-size="34" font-weight="700" fill="#1F4D4F" text-anchor="middle">II</text>
<ellipse cx="640" cy="150" rx="105" ry="68" fill="#F7EDD6" stroke="#1F4D4F" stroke-width="3"/>
<rect x="614" y="142" width="52" height="16" rx="8" fill="#B86A3C"/>
<circle cx="610" cy="150" r="15" fill="#B86A3C"/>
<circle cx="670" cy="150" r="15" fill="#B86A3C"/>
<text x="640" y="268" font-size="34" font-weight="700" fill="#1F4D4F" text-anchor="middle">III</text>
<ellipse cx="280" cy="410" rx="105" ry="68" fill="#F7EDD6" stroke="#1F4D4F" stroke-width="3"/>
<rect x="218" y="411" width="62" height="10" rx="5" fill="#B86A3C"/>
<path d="M280,410 L314,416 L280,422 Z" fill="#B86A3C"/>
<circle cx="218" cy="416" r="15" fill="#B86A3C"/>
<circle cx="280" cy="416" r="15" fill="#B86A3C"/>
<circle cx="342" cy="402" r="15" fill="#B86A3C"/>
<text x="280" y="528" font-size="34" font-weight="700" fill="#1F4D4F" text-anchor="middle">IV</text>
<ellipse cx="520" cy="410" rx="105" ry="68" fill="#F7EDD6" stroke="#1F4D4F" stroke-width="3"/>
<circle cx="472" cy="410" r="15" fill="#B86A3C"/>
<circle cx="568" cy="410" r="15" fill="#B86A3C"/>
<text x="520" y="528" font-size="34" font-weight="700" fill="#1F4D4F" text-anchor="middle">V</text>
<line x1="400" y1="146" x2="400" y2="54" stroke="#1F4D4F" stroke-width="2"/>
<text x="400" y="48" font-size="22" font-weight="700" fill="#1F4D4F" text-anchor="middle">Istmo</text>
</g></svg>