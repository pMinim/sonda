<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
<rect width="720" height="520" fill="#FFFFFF"/>
<title>Classificação de Cairo: RT1, RT2 e RT3</title>
<desc>Três painéis lado a lado, vista vestibular de três dentes inferiores vizinhos (incisivo lateral, canino e primeiro pré-molar), com a gengiva. A recessão vestibular do canino é idêntica nos três painéis. RT1: as papilas preenchem o espaço entre as coroas e não há perda interproximal. RT2: as papilas desceram um pouco, menos que a margem vestibular, e abrem-se espaços escuros entre as raízes (perda interproximal menor ou igual à vestibular). RT3: as papilas desceram mais que a margem vestibular e as raízes ficam visíveis dos dois lados de um espaço escuro (perda interproximal maior que a vestibular). Medidas tomadas a partir da junção cemento-esmalte (JCE).</desc>
