<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img">
<title>Os cinco tipos de istmo, de I a V, em cortes transversais da raiz com canais e a comunicação entre eles.</title>
<desc>Cinco cortes transversais de raiz, cada um um anel oval de dentina com canais em terracota. I: dois canais com um pequeno brotamento incompleto saindo de um deles. II: dois canais ligados por uma faixa fina e nítida, o istmo. III: dois canais ligados por uma faixa completa muito curta. IV: três canais com faixas que os ligam, uma completa e outra incompleta. V: canais sem faixa visível entre eles.</desc>
<rect x="0" y="0" width="800" height="570" fill="#FAF7F0"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<ellipse cx="160" cy="150" rx="105" ry="68" fill="#F7EDD6" stroke="#1F4D4F" stroke-width="3"/>
<circle cx="112" cy="150" r="15" fill="#B86A3C"/>
<circle cx="208" cy="150" r="15" fill="#B86A3C"/>
<path d="M112,144 L152,150 L112,156 Z" fill="#B86A3C"/>
<text x="160" y="268" font-size="34" font-weight="700" fill="#1F4D4F" text-anchor="middle">I</text>
