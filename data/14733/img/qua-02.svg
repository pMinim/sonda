<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <title>Corte transversal de canal oval com cone único deixando vazios laterais, e duas vistas estilizadas: ortorradial com obturação aparentemente adequada e angulada com espaços vazios.</title>
  <desc>Esquema em três partes. À esquerda, corte transversal de raiz com canal oval e um único cone de guta-percha redondo que deixa dois espaços vazios laterais. No meio, vista ortorradial estilizada, em que a obturação parece adequada. À direita, vista angulada estilizada, em que aparecem faixas escuras ao lado da obturação. Esquema, não radiografia real.</desc>
