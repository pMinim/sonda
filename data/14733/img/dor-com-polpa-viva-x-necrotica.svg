<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1060" width="720" height="1060" role="img">
  <title>Dor à percussão com polpa viva e com polpa morta</title>
  <desc>Dois cortes longitudinais esquemáticos de um dente de uma raiz, lado a lado, com a coroa para cima e a raiz para baixo, dentro do osso e da gengiva. À esquerda a polpa está viva; à direita está morta. Nos dois, o ligamento na ponta da raiz aparece inflamado, porque a dor à percussão indica inflamação do ligamento periodontal e não diz se a polpa está viva ou morta.</desc>
  <rect x="0" y="0" width="720" height="1060" fill="#FFFFFF"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="30" y="30" width="320" height="670" rx="18" fill="#E6EEEC" stroke="#1F4D4F" stroke-width="3"/>
  <rect x="370" y="30" width="320" height="670" rx="18" fill="#E6EEEC" stroke="#1F4D4F" stroke-width="3"/>
  <text x="190" y="90" font-size="34" font-weight="700" fill="#1F4D4F">Polpa viva</text>
  <text x="530" y="90" font-size="34" font-weight="700" fill="#1F4D4F">Polpa morta</text>
  <g transform="translate(0,-50)">
  <rect x="50" y="330" width="280" height="330" rx="14" fill="#E2CDB2" stroke="#C9AE8A" stroke-width="4"/>
  <path d="M50 330 L50 296 Q50 288 58 288 L152 288 L154 330 Z M330 330 L330 296 Q330 288 322 288 L228 288 L226 330 Z" fill="#F2A7A0" stroke="#1F4D4F" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="190" cy="566" rx="38" ry="28" fill="#B86A3C"/>
  <path d="M150 300 C130 262 128 208 150 186 Q190 162 230 186 C252 208 250 262 230 300 L222 330 L214 470 Q204 560 190 564 Q176 560 166 470 L158 330 Z" fill="#FBF6EA" stroke="#1F4D4F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M172 300 C164 268 164 232 176 216 Q190 206 204 216 C216 232 216 268 208 300 L202 330 L197 470 L193 544 L187 544 L183 470 L178 330 Z" fill="#E0605A"/>
  </g>
  <g transform="translate(0,-50)">
  <rect x="390" y="330" width="280" height="330" rx="14" fill="#E2CDB2" stroke="#C9AE8A" stroke-width="4"/>
  <path d="M390 330 L390 296 Q390 288 398 288 L492 288 L494 330 Z M670 330 L670 296 Q670 288 662 288 L568 288 L566 330 Z" fill="#F2A7A0" stroke="#1F4D4F" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="530" cy="566" rx="38" ry="28" fill="#B86A3C"/>
  <path d="M490 300 C470 262 468 208 490 186 Q530 162 570 186 C592 208 590 262 570 300 L562 330 L554 470 Q544 560 530 564 Q516 560 506 470 L498 330 Z" fill="#FBF6EA" stroke="#1F4D4F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M512 300 C504 268 504 232 516 216 Q530 206 544 216 C556 232 556 268 548 300 L542 330 L537 470 L533 544 L527 544 L523 470 L518 330 Z" fill="#7C7C76"/>
  </g>
  <text x="190" y="588" font-size="24" fill="#1F4D4F">ligamento inflamado</text>
  <text x="530" y="588" font-size="24" fill="#1F4D4F">ligamento inflamado</text>
  <text x="190" y="662" font-size="30" font-weight="700" fill="#B86A3C">Dor à percussão</text>
  <text x="530" y="662" font-size="30" font-weight="700" fill="#B86A3C">Dor à percussão</text>
  <rect x="30" y="720" width="660" height="150" rx="18" fill="#FFFFFF" stroke="#B86A3C" stroke-width="4"/>
  <text x="360" y="771" font-size="30" font-weight="700" fill="#1F4D4F">Dor à percussão indica inflamação</text>
  <text x="360" y="808" font-size="30" font-weight="700" fill="#1F4D4F">do ligamento periodontal.</text>
  <text x="360" y="850" font-size="26" fill="#4A5B5C">Não diz se a polpa está viva ou morta.</text>
  <rect x="30" y="890" width="660" height="150" rx="18" fill="#E6EEEC" stroke="#1F4D4F" stroke-width="3"/>
  <text x="360" y="936" font-size="28" fill="#4A5B5C">A conduta de urgência sai do par</text>
  <text x="360" y="978" font-size="30" font-weight="700" fill="#1F4D4F">diagnóstico pulpar</text>
  <text x="360" y="1016" font-size="30" font-weight="700" fill="#1F4D4F">+ diagnóstico periapical</text>
  </g>
</svg>
