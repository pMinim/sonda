<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560">
<rect width="720" height="560" fill="#FFFFFF"/>
<title>A férula: com e sem</title>
<desc>Dois cortes vestibulolinguais do mesmo pré-molar inferior de raiz única tratado endodonticamente, na mesma escala, com coroa protética, núcleo, pino, obturação no terço apical, gengiva e osso. Com férula: acima da gengiva sobra um anel de dentina do próprio dente, de 1,5 a 2 mm de altura, em volta da base do núcleo; a coroa desce por fora e termina sobre essa dentina, de modo que, de fora para dentro, ficam coroa, dentina e núcleo. Sem férula: a raiz termina plana na altura da gengiva, o núcleo assenta direto sobre ela e a coroa termina na junção núcleo-raiz, sem dentina entre coroa e núcleo.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B86A3C" stroke-width="2.5"/></pattern></defs>
<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<g transform="translate(0,0)">
<clipPath id="pc0"><rect x="2" y="8" width="350" height="472" rx="14"/></clipPath>
<rect x="2" y="8" width="350" height="472" rx="14" fill="#FAF8F4" stroke="#E2CDB2" stroke-width="3"/>
<text x="177" y="46" font-size="30" font-weight="700" fill="#1F4D4F" text-anchor="middle">Com férula</text>
<g clip-path="url(#pc0)">
<rect x="-10" y="324" width="400" height="160" fill="#E2CDB2"/>
