  <text x="54.0" y="385" font-size="19" font-weight="700" fill="#B86A3C" text-anchor="middle">vazios</text>
  <ellipse cx="185.0" cy="235" rx="13" ry="12" fill="none" stroke="#B86A3C" stroke-width="3.5" stroke-dasharray="5 4"/>
  <line x1="188.0" y1="248" x2="218.0" y2="339" stroke="#B86A3C" stroke-width="2.5"/>
