<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 807" width="800" height="807" role="img">
  <title>Hipoglicemia no consultório: consciente ou inconsciente</title>
  <desc>Fluxograma em duas colunas. Paciente consciente: carboidrato oral, cerca de 100 mL a cada 5 a 10 minutos e observação por cerca de 1 hora. Paciente inconsciente: posição supina com pernas elevadas, via aérea pérvia e dextrose ou glucagon. Aviso em vermelho: nada por via oral ao inconsciente.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4D4F"/></marker></defs>
  <rect x="0" y="0" width="800" height="807" fill="#FAF7F0"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="30" y="20" width="740" height="83.9" rx="14" fill="#E2CDB2" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="400" y="56.54" font-size="23" fill="#1F4D4F" font-weight="700" text-anchor="middle">Diabético com sinais de hipoglicemia</text>
  <text x="400" y="83.5" font-size="20" fill="#4A5B5C" text-anchor="middle">Interromper o procedimento</text>
  <rect x="30" y="121.9" width="362" height="56.6" rx="14" fill="#E6EEEC" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="211" y="157.46" font-size="22" fill="#1F4D4F" font-weight="700" text-anchor="middle">Consciente e cooperativo</text>
  <rect x="408" y="121.9" width="362" height="56.6" rx="14" fill="#E6EEEC" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="589" y="157.46" font-size="22" fill="#1F4D4F" font-weight="700" text-anchor="middle">Inconsciente</text>
  <line x1="211" y1="179.5" x2="211" y2="193.5" stroke="#1F4D4F" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="30" y="194.5" width="362" height="52.7" rx="14" fill="#FFFFFF" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="44" y="227.12" font-size="19" fill="#4A5B5C">Sentado, como preferir</text>
  <line x1="211" y1="248.2" x2="211" y2="262.2" stroke="#1F4D4F" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="30" y="263.2" width="362" height="126.8" rx="14" fill="#FFFFFF" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="44" y="295.82" font-size="19" fill="#4A5B5C">Carboidrato oral: açúcar</text>
  <text x="44" y="320.52" font-size="19" fill="#4A5B5C">dissolvido, suco ou refrigerante.</text>
  <text x="44" y="345.22" font-size="19" fill="#4A5B5C">Cerca de 100 mL a cada 5 a 10 min</text>
  <text x="44" y="369.92" font-size="19" fill="#4A5B5C">até os sintomas passarem</text>
  <line x1="211" y1="391" x2="211" y2="405" stroke="#1F4D4F" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="30" y="406" width="362" height="77.4" rx="14" fill="#FFFFFF" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="44" y="438.62" font-size="19" fill="#4A5B5C">Observar cerca de 1 h antes de</text>
  <text x="44" y="463.32" font-size="19" fill="#4A5B5C">liberar</text>
  <rect x="30" y="499.4" width="362" height="126.8" rx="14" fill="#F3E0D0" stroke="#B86A3C" stroke-width="2.5"/>
  <text x="44" y="532.02" font-size="19" fill="#B86A3C" font-weight="700">Sem resposta ou sem cooperar</text>
  <text x="44" y="556.72" font-size="19" fill="#4A5B5C">Chamar assistência médica. Glucagon</text>
  <text x="44" y="581.42" font-size="19" fill="#4A5B5C">1 mg IM ou IV, ou dextrose 50% (50</text>
  <text x="44" y="606.12" font-size="19" fill="#4A5B5C">mL) IV em 2 a 3 min</text>
  <rect x="408" y="190.5" width="362" height="77.4" rx="14" fill="#B86A3C" stroke="#B86A3C" stroke-width="2.5"/>
  <text x="589" y="223.12" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">Nunca líquido nem gel por via</text>
  <text x="589" y="247.82" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">oral: risco de aspiração</text>
  <line x1="589" y1="268.9" x2="589" y2="282.9" stroke="#1F4D4F" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="408" y="283.9" width="362" height="102.1" rx="14" fill="#FFFFFF" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="422" y="316.52" font-size="19" fill="#4A5B5C">Supina, pernas ligeiramente</text>
  <text x="422" y="341.22" font-size="19" fill="#4A5B5C">elevadas. Vias aéreas pérvias</text>
  <text x="422" y="365.92" font-size="19" fill="#4A5B5C">(suporte básico de vida)</text>
  <line x1="589" y1="387" x2="589" y2="401" stroke="#1F4D4F" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="408" y="402" width="362" height="77.4" rx="14" fill="#FFFFFF" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="422" y="434.62" font-size="19" fill="#1F4D4F" font-weight="700">Dextrose 50% IV ou glucagon 1</text>
  <text x="422" y="459.32" font-size="19" fill="#1F4D4F" font-weight="700">mg IM</text>
  <line x1="589" y1="480.4" x2="589" y2="494.4" stroke="#1F4D4F" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="408" y="495.4" width="362" height="77.4" rx="14" fill="#FFFFFF" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="422" y="528.02" font-size="19" fill="#4A5B5C">Se não responder ao suporte:</text>
  <text x="422" y="552.72" font-size="19" fill="#4A5B5C">solicitar assistência médica</text>
  <line x1="589" y1="573.8" x2="589" y2="587.8" stroke="#1F4D4F" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="408" y="588.8" width="362" height="77.4" rx="14" fill="#FFFFFF" stroke="#1F4D4F" stroke-width="2.5"/>
  <text x="422" y="621.42" font-size="19" fill="#4A5B5C">Ao acordar: suco ou refrigerante</text>
  <text x="422" y="646.12" font-size="19" fill="#4A5B5C">por via oral</text>
  <rect x="30" y="684.2" width="740" height="74.8" rx="14" fill="#E2CDB2" stroke="#E2CDB2" stroke-width="2.5"/>
  <text x="44" y="715.84" font-size="18" fill="#4A5B5C">Resposta ao glucagon IM: cerca de 10 a 15 min no consciente e 10 a 20 min no</text>
  <text x="44" y="739.24" font-size="18" fill="#4A5B5C">inconsciente. À dextrose IV: cerca de 5 min.</text>
  <text x="30" y="785" font-size="18" fill="#4A5B5C">Malamed, 7ª ed., cap. 17 (EUA).</text>
  </g>
</svg>
